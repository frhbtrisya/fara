@media (max-width: 900px) {

.masonry-item {
  break-inside: avoid;  margin-bottom: 12px;  border-radius: 8px;  overflow: hidden;
  background: #f7f7f7;  transition: transform 0.3s;
}

.masonry-item:hover {
  transform: scale(1.02);
}

.masonry-item img,
.masonry-item video {
  width: 100%;  display: block; border-radius: 8px;  object-fit: cover;
}


footer {

}

footer .social-footer a img {
  width: 35px;  height: 35px;  object-fit: cover;  border-radius: 50%;  transition: 0.3s;
}

footer .social-footer a img:hover {
  transform: scale(1.2);
}

@media (max-width: 700px) {
  header h1 {
    font-size: 2.2rem;

  nav a {
    display: block;
    margin: 5px 0;
